<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benja's Web | IA Directa</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #111827;
            --border-color: #1f2937;
            --accent: #38bdf8;
            --text-main: #f1f5f9;
            --text-muted: #9ca3af;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 15px;
            margin: 0;
        }
        .container { max-width: 750px; margin: auto; }
        h1 { color: var(--accent); font-size: 22px; text-align: center; margin-bottom: 15px; }
        
        .tab-menu { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn {
            flex: 1; padding: 12px; background: #1f2937; border: 1px solid #374151;
            color: var(--text-muted); font-weight: bold; border-radius: 10px; cursor: pointer; text-align: center; font-size: 13px;
        }
        .tab-btn.active { background: #38bdf8; color: #0b0f19; border-color: #38bdf8; }

        .tab-content {
            display: none; background: var(--panel-bg); padding: 20px; border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7); border: 1px solid var(--border-color);
        }
        .tab-content.active { display: block; }

        h3 { margin-top: 0; color: var(--accent); font-size: 16px; }
        p.desc { font-size: 12px; color: var(--text-muted); margin-bottom: 15px; }
        label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 6px; font-weight: 600; }
        input, textarea {
            width: 100%; padding: 11px; background: var(--bg-color); border: 1px solid #4b5563;
            color: #fff; border-radius: 8px; box-sizing: border-box; font-size: 14px; margin-bottom: 12px;
        }
        input:focus, textarea:focus { outline: none; border-color: var(--accent); }

        .btn-action {
            width: 100%; padding: 12px; background: #22c55e; color: #0b0f19; font-weight: bold;
            border: none; border-radius: 8px; cursor: pointer; font-size: 14px;
        }
        .btn-ai { background: #a855f7; color: #fff; }
        pre {
            background: #030712; padding: 12px; border-radius: 8px; overflow-x: auto;
            color: #4ade80; font-size: 12px; border: 1px solid var(--border-color); margin-top: 10px; max-height: 250px; white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ BENJA'S WEB ⚡</h1>

        <div class="tab-menu">
            <button class="tab-btn active" onclick="switchTab('analizador', this)">🔍 Analizador Luau</button>
            <button class="tab-btn" onclick="switchTab('deepseek', this)">🌐 IA Autónoma + Roblox</button>
        </div>

        <!-- Pestaña 1: Analizador Luau -->
        <div id="analizador" class="tab-content active">
            <h3>Analizador de Scripts Luau</h3>
            <p class="desc">Revisa tu código en busca de errores y paréntesis faltantes.</p>
            <label>Pega tu código aquí:</label>
            <textarea id="luauInput" rows="6" placeholder="local x = 10..."></textarea>
            <button class="btn-action" id="checkCodeBtn">Revisar Código</button>
            <label style="margin-top: 15px;">Diagnóstico:</label>
            <pre id="luauOutput">Esperando código...</pre>
        </div>

        <!-- Pestaña 2: IA Limpia sin casillas estorbosas -->
        <div id="deepseek" class="tab-content">
            <h3>Inteligencia Artificial Autónoma</h3>
            <p class="desc">La IA busca en la web y manda el resultado directo al juego de forma completamente automática.</p>
            
            <label>API Key de la IA:</label>
            <input type="password" id="apiKey" placeholder="Introduce tu clave...">

            <label>¿Qué quieres que la IA busque y meta al juego?</label>
            <textarea id="userPrompt" rows="3" placeholder="Ej: Búscame el marcador oficial de la Champions League y ponlo en el juego..."></textarea>
            
            <button class="btn-action btn-ai" id="executeDirectBtn">🚀 Ejecutar IA y Enviar al Juego</button>
            
            <label style="margin-top: 15px;">Estado de la Operación:</label>
            <pre id="aiOutput">Esperando orden...</pre>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
